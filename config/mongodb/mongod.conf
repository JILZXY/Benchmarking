# =============================================================================
# MongoDB - configuración del benchmark ETICORE
# =============================================================================
# Valores dependientes del perfil experimental (NO se definen aquí):
#   storage.wiredTiger.engineConfig.cacheSizeGB -> --wiredTigerCacheSizeGB
#   (variable MONGO_WT_CACHE_GB en config/profiles/*.env)
#
# La autenticación (--auth) la agrega el entrypoint de la imagen oficial al
# definir MONGO_INITDB_ROOT_USERNAME / MONGO_INITDB_ROOT_PASSWORD.
#
# Los logs se envían a stdout (formato JSON) para recuperarlos con
# `docker logs` como evidencia de cada ejecución.
# =============================================================================

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

net:
  port: 27017
  bindIpAll: true

# Evidencia de almacenamiento temporal (spill):
# con un filtro definido, slowOpThresholdMs no se usa y solo las operaciones
# que cumplen el filtro se escriben en el log de diagnóstico. mode "off" evita
# escribir en system.profile durante la medición (sin sobrecarga adicional).
operationProfiling:
  mode: "off"
  filter: '{ "usedDisk": true }'

setParameter:
  # FTDC habilitado para conservar diagnóstico interno del motor.
  diagnosticDataCollectionEnabled: true

