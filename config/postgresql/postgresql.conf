# =============================================================================
# PostgreSQL - configuración del benchmark ETICORE
# =============================================================================
# Valores dependientes del perfil experimental (se pasan con -c en compose.yaml
# y tienen prioridad sobre este archivo):
#   shared_buffers        -> PG_SHARED_BUFFERS
#   effective_cache_size  -> PG_EFFECTIVE_CACHE_SIZE
#
# work_mem es una variable de la carga Q2 (4 MB / 64 MB): el runner la fija por
# sesión con SET work_mem. El valor global coincide con el default (4 MB).
# =============================================================================

# --- Conexiones ---------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 120                # 50 clientes concurrentes + margen

# --- Memoria ------------------------------------------------------------------
shared_buffers = 128MB               # sobrescrito por el perfil
effective_cache_size = 512MB         # sobrescrito por el perfil
work_mem = 4MB
maintenance_work_mem = 128MB         # creación de índices tras la carga
huge_pages = off
dynamic_shared_memory_type = posix

# --- Estadísticas y evidencia -------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 1000
track_io_timing = on

# --- Logging (stderr -> docker logs) -----------------------------------------
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
log_checkpoints = on
log_min_duration_statement = -1
# Evidencia de almacenamiento temporal (spill): registra todo archivo temporal
# creado (ordenamientos externos, hashes en disco), con su tamaño.
log_temp_files = 0

# --- Localización -------------------------------------------------------------
timezone = 'UTC'

